[tools]
java = "21"
node = "22"
pnpm = "latest"
rust = { version = "1.96.0", components = "clippy,rustfmt", targets = "aarch64-linux-android,x86_64-linux-android,aarch64-unknown-linux-musl" }

[env]
ANDROID_HOME = "{{env.HOME}}/Android/Sdk"
NDK_HOME = "{{env.HOME}}/Android/Sdk/ndk/27.1.12297006"

# Verification gates for the Tauri port (openspec/changes/port-to-tauri, design D11).
# Desktop first: `verify` runs G1-G3 on every task. `verify:mobile` (G4, G5)
# starts once the app is complete on the desktop.

[tasks."setup:ui"]
description = "Install the UI dependencies from the lockfile"
dir = "ui"
run = "pnpm install --frozen-lockfile"

[tasks."build:ui"]
description = "Build the UI bundle that the Tauri app embeds"
dir = "ui"
depends = ["setup:ui"]
run = "pnpm exec vite build"

[tasks.dev]
description = "Run the app on the desktop with hot reload (config/app-config.toml, else the example)"
dir = "src-tauri"
depends = ["setup:ui"]
run = "cargo tauri dev"

[tasks."verify:core"]
description = "G1: Rust format, lint, and tests"
dir = "src-tauri"
depends = ["build:ui"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo test --workspace --all-features",
]

[tasks."test:secret-service"]
description = "SecretStore contract against the session's Secret Service (writes, then deletes, test items)"
dir = "src-tauri"
run = "cargo test -p ta-core --test store -- --ignored"

[tasks.bindings]
description = "Regenerate the ts-rs TypeScript bindings in ui/src/bindings"
run = "scripts/bindings.sh"

[tasks."verify:ui"]
description = "G2: UI typecheck, lint, tests, and binding staleness"
dir = "ui"
depends = ["setup:ui"]
run = ["../scripts/bindings.sh --check", "pnpm typecheck", "pnpm lint", "pnpm test"]

[tasks."setup:e2e"]
description = "Install the WebdriverIO suite from the lockfile"
dir = "e2e"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm typecheck",
  "APPIUM_HOME=$PWD/.appium pnpm exec appium driver list --installed --json | grep -q uiautomator2 || APPIUM_HOME=$PWD/.appium pnpm exec appium driver install uiautomator2@8.7.0",
]

[tasks."e2e:desktop"]
description = "G3: desktop end-to-end on WebKitGTK under headless weston"
depends = ["setup:e2e", "build:ui"]
run = "UI_PREBUILT=1 e2e/run-desktop.sh"

[tasks."e2e:android"]
description = "G4: Android end-to-end on the headless Pixel_8 emulator through Appium"
depends = ["setup:e2e", "build:ui"]
# The emulator console and adb ports are shared, so never run two at once.
run = "UI_PREBUILT=1 e2e/run-android.sh"

[tasks."package:pmos"]
description = "postmarketOS apk in rootless podman: x86_64, or pass aarch64 for the phone"
depends = ["build:ui"]
run = "packaging/build-alpine.sh"

[tasks."e2e:pmos"]
description = "G5: install, provision, and restart the app in the postmarketOS qemu-amd64 VM"
depends = ["build:ui"]
env = { TA_DROID_CONFIG = "config/app-config.e2e.toml", ALPINE_OUT = "{{config_root}}/artifacts/g5/pkg", ALPINE_FAST = "1" }
run = ["packaging/build-alpine.sh x86_64", "e2e/run-pmos.sh"]

[tasks.verify]
description = "Desktop gates: G1-G3"
depends = ["verify:core", "verify:ui", "e2e:desktop"]
run = "echo 'verify: all gates passed'"

[tasks."verify:mobile"]
description = "Mobile gates: G4 and G5"
depends = ["e2e:android", "e2e:pmos"]
run = "echo 'verify:mobile: all gates passed'"
