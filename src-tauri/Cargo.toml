[workspace]
members = [".", "crates/fake-backends", "crates/talib-sys", "crates/core", "crates/provision"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[package]
name = "ta-droid"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ta_droid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
ta-core = { path = "crates/core" }

[dependencies]
tauri = { version = "2", features = [] }
ta-core = { path = "crates/core" }
ta-provision = { path = "crates/provision" }
thiserror.workspace = true
tokio.workspace = true
ts-rs.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
fake-backends = { path = "crates/fake-backends" }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true

[features]
# Compiles in the e2e backend profile and the file-backed secret store.
e2e = []

[profile.release]
lto = true
codegen-units = 1
strip = true

# Argon2 at 256 MiB takes minutes unoptimized; keep dev builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
