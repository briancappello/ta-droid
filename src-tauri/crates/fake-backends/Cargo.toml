[package]
name = "fake-backends"
version = "0.1.0"
description = "Test double for MarketStore, fa-techan, and Alpaca used by the e2e gates"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "fs", "io-util", "signal"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# reqwest's TLS features are unified across the workspace (ta-core picks
# rustls without a provider), so tests install one.
ta-core = { path = "../core" }
futures = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
