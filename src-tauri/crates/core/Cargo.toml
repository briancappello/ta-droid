[package]
name = "ta-core"
version = "0.1.0"
description = "Domain logic and backend clients for ta-droid (no Tauri dependency)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "1"
keyring-core = "1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3"
