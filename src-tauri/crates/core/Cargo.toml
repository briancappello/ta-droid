[package]
name = "ta-core"
version = "0.1.0"
description = "Domain logic and backend clients for ta-droid (no Tauri dependency)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "1"
talib-sys = { path = "../talib-sys" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
rustls-pki-types = "1"
tokio.workspace = true
futures = "0.3"
getrandom = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
keyring-core = "1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tempfile = "3"
wiremock = "0.6"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
rcgen = "0.14"
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
