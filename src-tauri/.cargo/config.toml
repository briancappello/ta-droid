[env]
# ts-rs writes TypeScript bindings when `cargo test` runs its export tests.
# Plain test runs write into target/ so they never touch the UI; run
# `mise run bindings` to regenerate ui/src/bindings, and G2 fails if those
# committed files are stale.
TS_RS_EXPORT_DIR = { value = "target/ts-bindings", relative = true }
